{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <title>{% block title %}Task Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'Managment/css/auth.css' %}">
</head>

<body>
    <div class="deco dots dots-tr"></div>

    <script src="{% static 'Managment/js/password.js' %}"></script>

</html>
