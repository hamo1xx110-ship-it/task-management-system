{% extends "Managment/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a class="btn" href="{% url 'task_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
